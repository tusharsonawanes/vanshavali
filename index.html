<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vanshavali — Our People. Our Story.</title>
<style>
  :root, [data-theme="dark"]{
    color-scheme:dark;
    --bg:#08090b;
    --surface-0:#0c0e11;
    --surface-1:#111418;
    --surface-2:#161a20;
    --surface-3:#1c2128;
    --border:#23282f;
    --border-soft:#1a1e24;
    --text:#e9edf2;
    --text-dim:#9aa4b1;
    --text-faint:#69727e;
    --accent:#3b82f6;
    --accent-hover:#4d8ef7;
    --accent-text:#a9c9ff;
    --on-accent:#ffffff;
    --accent-soft:rgba(59,130,246,.16);
    --accent-line:rgba(59,130,246,.55);
    --rose:#b06b7d;
    --danger:#e2707f;
    /* chrome */
    --header-a:#0e1114;
    --header-b:#0a0c0f;
    --mark-a:#243447;
    --mark-b:#12161b;
    --logo-stroke:#7fb0ff;
    --canvas-a:#0e1319;
    --canvas-b:#08090b;
    --glass:rgba(17,20,24,.86);
    --scrim:rgba(4,5,7,.62);
    --dither-opacity:.05;
    --dither-blend:overlay;
    /* person cards */
    --node-m:#141920;
    --node-f:#1e1519;
    --node-stroke:#262c34;
    --node-stroke-hover:#39414c;
    --node-ini:#c8d2de;
    --node-sub:#8d97a4;
    --avatar-m:#20293a;
    --avatar-f:#33222a;
    --avatar-stroke:#333b45;
    --ini-muted:#8f9bab;
    --deceased-dot:#6b7480;
    /* relationship-line palette — Apple system colors (dark-mode values) so
       each connection type reads as a distinct, deliberate hue rather than
       one flat grey line for everything. */
    --line-parent:#0a84ff;         /* systemBlue   — biological parent → child */
    --line-parent-adopted:#bf5af2; /* systemPurple — adopted parent → child */
    --line-spouse:#ff375f;         /* systemPink   — married */
    --line-spouse-divorced:#8e8e93;/* systemGray   — divorced */
    --line-sibling:#64d2ff;        /* systemTeal   — siblings (full) */
    --line-sibling-half:#5e8fa8;   /* dimmed teal  — half-siblings */
    --zone-unmapped:#5a5f6a;
    --zone-fill:rgba(255,255,255,.015);
    --del-border:#6d2534;
    --del-bg:#2a1219;
    --del-bg-hover:#3b1723;
    --del-text:#ff6b81;
    --drop-bg:rgba(59,130,246,.07);
    --drop-text:#cfe0ff;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 8px 24px -8px rgba(0,0,0,.65);
    --shadow-3:0 24px 60px -20px rgba(0,0,0,.8);
    --dur:.28s;
    --ease:cubic-bezier(.22,.61,.36,1);
    --radius:14px;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,system-ui,sans-serif;
  }

  /* ---------- light appearance ---------- */
  [data-theme="light"]{
    color-scheme:light;
    --bg:#f5f5f7;
    --surface-0:#ffffff;
    --surface-1:#ffffff;
    --surface-2:#f2f2f5;
    --surface-3:#e7e8ec;
    --border:#d9dade;
    --border-soft:#e6e7ea;
    --text:#1c1d21;
    --text-dim:#5f6570;
    --text-faint:#8a8f99;
    --accent:#0060df;
    --accent-hover:#0a6ff0;
    --accent-text:#0a4fa8;
    --on-accent:#ffffff;
    --accent-soft:rgba(0,96,223,.10);
    --accent-line:rgba(0,96,223,.45);
    --rose:#9c5265;
    --danger:#c8384c;
    --header-a:#ffffff;
    --header-b:#f4f4f6;
    --mark-a:#dde6f4;
    --mark-b:#f6f8fb;
    --logo-stroke:#2f6fd0;
    --canvas-a:#ffffff;
    --canvas-b:#eceef2;
    --glass:rgba(255,255,255,.86);
    --scrim:rgba(28,30,36,.28);
    --dither-opacity:0;
    --dither-blend:normal;
    --node-m:#ffffff;
    --node-f:#fffafb;
    --node-stroke:#d5d7dd;
    --node-stroke-hover:#a9adb8;
    --node-ini:#4b5260;
    --node-sub:#787f8b;
    --avatar-m:#e3ebf7;
    --avatar-f:#f8e6ec;
    --avatar-stroke:#dadde4;
    --ini-muted:#7c828d;
    --deceased-dot:#a3a8b2;
    --line-parent:#0071e3;
    --line-parent-adopted:#8944ab;
    --line-spouse:#d4285a;
    --line-spouse-divorced:#8e8e93;
    --line-sibling:#0a91b8;
    --line-sibling-half:#6d9aab;
    --zone-unmapped:#a4a9b3;
    --zone-fill:rgba(20,24,32,.02);
    --del-border:#f0c2c9;
    --del-bg:#fdeef0;
    --del-bg-hover:#f9dde1;
    --del-text:#c8384c;
    --drop-bg:rgba(0,96,223,.06);
    --drop-text:#0a4fa8;
    --shadow-1:0 1px 2px rgba(20,24,32,.08);
    --shadow-2:0 8px 24px -8px rgba(20,24,32,.18);
    --shadow-3:0 24px 60px -20px rgba(20,24,32,.28);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);color:var(--text);font-family:var(--font);
    font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden;
  }
  button{font-family:inherit;color:inherit;}
  :focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent);border-radius:8px;}
  input:focus-visible,textarea:focus-visible,select:focus-visible{box-shadow:none;}
  .app{display:flex;flex-direction:column;height:100%;}

  /* ---------- header ---------- */
  header{
    height:64px;flex:0 0 64px;display:flex;align-items:center;gap:16px;
    padding:0 16px;border-bottom:1px solid var(--border-soft);
    background:linear-gradient(180deg,var(--header-a),var(--header-b));position:relative;z-index:40;
  }
  .brand{display:flex;align-items:center;gap:11px;min-width:236px;}
  .brand .mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
    background:radial-gradient(120% 120% at 30% 10%,var(--mark-a),var(--mark-b));border:1px solid var(--border);}
  .brand h1{font-size:15px;letter-spacing:.16em;margin:0;font-weight:600;}
  .brand p{margin:1px 0 0;font-size:10.5px;color:var(--text-faint);letter-spacing:.04em;}
  .spacer{flex:1;}
  .search-wrap{position:relative;width:min(420px,34vw);}
  .search-wrap input[type=text]{
    width:100%;height:38px;border-radius:11px;border:1px solid var(--border);
    background:var(--surface-1);color:var(--text);padding:0 12px 0 36px;font-size:13px;
    transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease);
  }
  .search-wrap input[type=text]::placeholder{color:var(--text-faint);}
  .search-wrap input[type=text]:focus{border-color:var(--accent);background:var(--surface-2);box-shadow:none;outline:none;}
  .search-wrap svg.si{position:absolute;left:11px;top:11px;color:var(--text-faint);pointer-events:none;}
  .results{
    position:absolute;top:46px;left:0;right:0;background:var(--surface-2);
    border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-3);
    padding:6px;max-height:340px;overflow:auto;display:none;
  }
  .results.show{display:block;}
  .res-item{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;
    padding:8px;border-radius:10px;cursor:pointer;text-align:left;}
  .res-item:hover,.res-item.active{background:var(--surface-3);}
  .res-item .nm{font-size:13px;}
  .res-item .dt{font-size:11px;color:var(--text-faint);}
  .res-empty{padding:14px;font-size:12.5px;color:var(--text-faint);text-align:center;}

  .btn{
    height:38px;border-radius:11px;border:1px solid var(--border);background:var(--surface-1);
    padding:0 14px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:8px;
    cursor:pointer;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),transform .12s var(--ease);
  }
  .btn:hover{background:var(--surface-3);}
  .btn:active{transform:scale(.975);}
  .btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent);font-weight:560;}
  .btn.primary:hover{background:var(--accent-hover);}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--text-dim);}
  .btn.ghost:hover{background:var(--surface-2);color:var(--text);}
  #themeBtn{width:38px;padding:0;justify-content:center;color:var(--text-dim);}
  #themeBtn:hover{color:var(--text);}
  [data-theme="dark"] #themeBtn .ic-moon,
  [data-theme="light"] #themeBtn .ic-sun{display:none;}

  .btn.sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:9px;}
  .btn.danger{color:var(--danger);}

  .menu{
    position:absolute;top:56px;right:16px;width:266px;background:var(--surface-2);
    border:1px solid var(--border);border-radius:15px;box-shadow:var(--shadow-3);padding:6px;
    opacity:0;transform:translateY(-6px) scale(.985);pointer-events:none;
    transition:opacity .18s var(--ease),transform .18s var(--ease);z-index:60;
  }
  .menu.show{opacity:1;transform:none;pointer-events:auto;}
  .menu button{display:flex;gap:12px;align-items:flex-start;width:100%;background:none;border:0;
    padding:10px;border-radius:11px;cursor:pointer;text-align:left;}
  .menu button:hover{background:var(--surface-3);}
  .menu button > span{display:flex;flex-direction:column;min-width:0;}
  .menu .t{font-size:13px;line-height:1.25;}
  .menu .s{display:block;font-size:11px;color:var(--text-faint);margin-top:3px;line-height:1.3;}

  .menu svg{margin-top:2px;color:var(--text-dim);flex:0 0 auto;}

  /* ---------- body ---------- */
  .main{flex:1;display:flex;min-height:0;position:relative;}
  .canvas-wrap{flex:1;position:relative;overflow:hidden;background:
    radial-gradient(90% 70% at 50% 0%,var(--canvas-a) 0%,var(--canvas-b) 62%);}
  #svg{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;}
  #svg.dragging{cursor:grabbing;}

  .toolbar{
    position:absolute;left:20px;bottom:20px;display:flex;gap:10px;align-items:center;
  }
  .pill{display:flex;align-items:center;gap:2px;background:var(--glass);backdrop-filter:blur(14px);
    border:1px solid var(--border);border-radius:12px;padding:4px;box-shadow:var(--shadow-2);}
  .pill button{width:32px;height:32px;border:0;background:none;border-radius:9px;cursor:pointer;
    display:grid;place-items:center;color:var(--text-dim);}
  .pill button:hover{background:var(--surface-3);color:var(--text);}
  .pill .z{min-width:56px;text-align:center;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--text);}
  .tool-btn{height:40px;border-radius:12px;border:1px solid var(--border);background:var(--glass);
    backdrop-filter:blur(14px);padding:0 14px;font-size:12.5px;display:inline-flex;align-items:center;gap:8px;
    cursor:pointer;box-shadow:var(--shadow-2);transition:background var(--dur) var(--ease),color var(--dur) var(--ease),border-color var(--dur) var(--ease);}
  .tool-btn:hover{background:var(--surface-3);}
  .tool-btn.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-text);}

  /* ---------- inspector ---------- */
  .inspector{
    width:372px;flex:0 0 372px;border-left:1px solid var(--border-soft);background:var(--surface-0);
    display:flex;flex-direction:column;overflow:hidden;
    margin-right:-372px;opacity:0;transition:margin-right .34s var(--ease),opacity .26s var(--ease);
  }
  .inspector.open{margin-right:0;opacity:1;}
  .insp-scroll{overflow:auto;padding:20px 22px 40px;}
  .insp-top{display:flex;justify-content:flex-end;padding:12px 12px 0;}
  .icon-btn{width:30px;height:30px;border-radius:9px;border:0;background:none;color:var(--text-faint);
    cursor:pointer;display:grid;place-items:center;}
  .icon-btn:hover{background:var(--surface-2);color:var(--text);}
  .insp-photo{width:132px;height:158px;border-radius:16px;object-fit:cover;border:1px solid var(--border);
    background:var(--surface-2);display:block;}
  .insp-name{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:16px 0 2px;}
  .insp-dates{font-size:13px;color:var(--text-dim);}
  .insp-headrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;}
  .tabs{display:flex;gap:4px;background:var(--surface-1);border:1px solid var(--border-soft);
    border-radius:11px;padding:4px;margin:20px 0 18px;}
  .tabs button{flex:1;height:30px;border:0;background:none;border-radius:8px;font-size:12.5px;
    color:var(--text-dim);cursor:pointer;transition:background var(--dur) var(--ease),color var(--dur) var(--ease);}
  .tabs button.on{background:var(--surface-3);color:var(--text);}
  .field{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--border-soft);}
  .field:last-child{border-bottom:0;}
  .field svg{color:var(--text-faint);margin-top:2px;flex:0 0 auto;}
  .field .k{font-size:11px;color:var(--text-faint);}
  .field .v{font-size:13.5px;margin-top:2px;white-space:pre-wrap;}
  .sec-title{font-size:12px;color:var(--text-faint);letter-spacing:.06em;text-transform:uppercase;margin:22px 0 8px;}
  .rel-row{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;padding:9px 8px;
    border-radius:11px;cursor:pointer;text-align:left;transition:background var(--dur) var(--ease);}
  .rel-row:hover{background:var(--surface-2);}
  .rel-row .k{font-size:11px;color:var(--text-faint);}
  .rel-row .v{font-size:13.5px;margin-top:1px;}
  .rel-row .chev{margin-left:auto;color:var(--text-faint);}
  .rel-row-wrap{display:flex;align-items:center;gap:4px;}
  .rel-row-wrap .rel-row{flex:1;min-width:0;}
  .rel-row-wrap select{width:auto;padding:5px 8px;font-size:11px;flex:0 0 auto;}
  .rel-row-wrap .icon-btn{flex:0 0 auto;color:var(--text-faint);}
  .rel-row-wrap .icon-btn:hover{color:var(--danger);background:var(--surface-2);}
  .media-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
  .media-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:11px;border:1px solid var(--border);}
  .media-add{aspect-ratio:1;border-radius:11px;border:1px dashed var(--border);background:var(--surface-1);
    display:grid;place-items:center;color:var(--text-faint);font-size:10.5px;cursor:pointer;gap:2px;}
  .media-add:hover{border-color:var(--accent-line);color:var(--text-dim);}
  .avatar{border-radius:50%;object-fit:cover;background:var(--surface-3);flex:0 0 auto;}

  /* ---------- empty ---------- */
  .empty{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
  .empty.show{display:flex;}
  .empty h2{font-size:20px;font-weight:600;margin:0;}
  .empty p{color:var(--text-dim);font-size:13.5px;margin:0 0 14px;}

  /* ---------- modal ---------- */
  .scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(3px);z-index:80;
    opacity:0;pointer-events:none;transition:opacity .2s var(--ease);display:grid;place-items:center;padding:28px;}
  .scrim.show{opacity:1;pointer-events:auto;}
  .modal{width:min(720px,100%);max-height:88vh;overflow:auto;background:var(--surface-1);
    border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow-3);
    transform:translateY(8px) scale(.99);transition:transform .22s var(--ease);}
  .scrim.show .modal{transform:none;}
  .modal header{height:auto;padding:20px 24px 16px;border-bottom:1px solid var(--border-soft);background:none;}
  .modal h3{margin:0;font-size:17px;font-weight:600;}
  .modal .sub{font-size:12.5px;color:var(--text-faint);margin-top:3px;}
  .modal .body{padding:20px 24px;}
  .modal .foot{padding:16px 24px;border-top:1px solid var(--border-soft);display:flex;justify-content:flex-end;gap:10px;
    position:sticky;bottom:0;background:var(--surface-1);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  label.f{display:block;}
  label.f span{display:block;font-size:11px;color:var(--text-faint);margin-bottom:6px;letter-spacing:.03em;}
  input[type=text],input[type=date],input[type=tel],input[type=email],input[type=number],textarea,select{
    width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
    color:var(--text);font-family:inherit;font-size:13px;padding:9px 11px;
    transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease);
    -webkit-appearance:none;appearance:none;}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--text-faint) 50%),linear-gradient(135deg,var(--text-faint) 50%,transparent 50%);
    background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px;}
  input::placeholder,textarea::placeholder{color:var(--text-faint);}
  input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none;}
  .phone-row{display:flex;gap:8px;}
  .phone-row select{flex:0 0 118px;}
  textarea{resize:vertical;min-height:70px;}
  .check{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--text-dim);cursor:pointer;}
  .check input{width:16px;height:16px;accent-color:var(--accent);}
  .photo-pick{display:flex;gap:14px;align-items:center;}
  .photo-pick img{width:72px;height:72px;border-radius:14px;object-fit:cover;border:1px solid var(--border);}
  .rel-add{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{height:30px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);
    padding:0 11px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .chip:hover{border-color:var(--accent-line);color:var(--accent-text);}
  .rel-list{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
  .rel-pill{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border);
    border-radius:11px;padding:8px 10px;font-size:13px;}
  .rel-pill .role{font-size:11px;color:var(--text-faint);width:66px;flex:0 0 auto;}
  .rel-pill select{width:auto;padding:5px 8px;font-size:11.5px;margin-left:auto;}
  .divider{height:1px;background:var(--border-soft);margin:20px 0;}
  .picker-list{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:2px;margin-top:12px;}
  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);background:var(--surface-3);
    border:1px solid var(--border);border-radius:12px;padding:11px 16px;font-size:13px;box-shadow:var(--shadow-3);
    opacity:0;pointer-events:none;transition:opacity .22s var(--ease),transform .22s var(--ease);z-index:120;}
  .toast.show{opacity:1;transform:translate(-50%,0);}

  /* ---------- svg tree ---------- */
  .node{cursor:pointer;transition:transform .42s var(--ease),opacity var(--dur) var(--ease);}
  .node .card{transition:fill var(--dur) var(--ease),stroke var(--dur) var(--ease);}
  .node:hover .card{stroke:var(--node-stroke-hover);}
  .node .nm{font-size:13.5px;font-weight:560;fill:var(--text);}
  .node .dt{font-size:11.5px;fill:var(--text-faint);}
  .node .ini{font-size:14px;font-weight:600;fill:var(--node-ini);text-anchor:middle;}
  .edge{fill:none;stroke:var(--line-parent);stroke-width:1.6;transition:opacity var(--dur) var(--ease),stroke var(--dur) var(--ease);}
  .edge.spouse{stroke:var(--line-spouse);}
  .edge.sibling{stroke:var(--line-sibling);stroke-width:1.4;stroke-dasharray:4 4;stroke-linecap:round;}
  .edge.sibling.half{stroke:var(--line-sibling-half);stroke-dasharray:1.5 5;}
  .edge.adopted{stroke:var(--line-parent-adopted);stroke-dasharray:1 5;stroke-linecap:round;}
  .edge.divorced{stroke-dasharray:5 4;stroke:var(--line-spouse-divorced);}
  .dim{opacity:.14;}
  [data-theme="light"] .dim{opacity:.26;}
  .edge.hot{stroke:var(--accent);opacity:1;stroke-width:2.2;}
  .edge-hit{fill:none;stroke:transparent;stroke-width:18;cursor:pointer;}
  .edge.hovered{stroke:var(--accent);opacity:1;stroke-width:2.8;}
  .edge-del{position:absolute;z-index:25;transform:translate(-50%,-50%);width:28px;height:28px;padding:0;
    border-radius:50%;border:1px solid var(--del-border);background:var(--del-bg);color:var(--del-text);display:grid;place-items:center;
    cursor:pointer;box-shadow:var(--shadow-2);transition:background var(--dur) var(--ease);}
  .edge-del:hover{background:var(--del-bg-hover);}
  .edge-del[hidden]{display:none;}
  .insp-headrow .head-actions{display:flex;gap:8px;align-items:center;}

  /* ---------- unmapped zone ---------- */
  .zone-unmapped-rect{fill:var(--zone-fill);stroke:var(--zone-unmapped);stroke-width:1.4;stroke-dasharray:6 6;rx:18;}
  .zone-unmapped-label{fill:var(--text-faint);font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;}

  /* ---------- legend ---------- */
  .legend{position:absolute;top:16px;right:16px;background:var(--glass);backdrop-filter:blur(14px);
    border:1px solid var(--border);border-radius:13px;box-shadow:var(--shadow-2);padding:10px 12px;
    font-size:12px;color:var(--text-dim);z-index:10;transition:opacity .2s var(--ease);}
  .legend.hide{display:none;}
  .legend .lg-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:6px;}
  .legend .lg-title{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint);font-weight:600;}
  .legend button{background:none;border:0;color:var(--text-faint);cursor:pointer;padding:2px;display:grid;place-items:center;}
  .legend button:hover{color:var(--text);}
  .legend .lg-row{display:flex;align-items:center;gap:8px;padding:3px 0;white-space:nowrap;}
  .legend .lg-swatch{width:18px;height:0;border-top:2.4px solid;flex:0 0 auto;}
  .legend .lg-swatch.dash{border-top-style:dashed;}
  .legend .lg-swatch.dot{border-top-style:dotted;border-top-width:3px;}
  body.dropping::after{content:"Drop a Vanshavali file to import";position:fixed;inset:12px;z-index:200;
    border:2px dashed var(--accent-line);border-radius:20px;background:var(--drop-bg);
    display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--drop-text);pointer-events:none;}
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important;}}

  /* ---------- anti-banding dither ----------
     The near-black gradients above (header, canvas background) sit only a
     few RGB values apart. Displays that don't dither 8-bit gradients well
     (common on non-Mac monitors, e.g. BenQ) render that as visible stepped
     bands / a "torn" look. A faint noise overlay breaks the banding up on
     every display without changing how the gradients look. */
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:200;
    opacity:var(--dither-opacity);mix-blend-mode:var(--dither-blend);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
</style>
<script>
  /* Set the appearance before first paint: saved choice if there is one,
     otherwise follow the device. */
  (function () {
    var t = null;
    try { t = localStorage.getItem("vanshavali.theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") {
      t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>

<div class="app">
  <header>
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" style="stroke:var(--logo-stroke)" stroke-width="1.6" stroke-linecap="round"><path d="M12 21v-7"></path><path d="M12 14c-3.6 0-6-2.2-6-5.2S8.4 3 12 3s6 2.8 6 5.8-2.4 5.2-6 5.2Z"></path><path d="M9 17.5h6"></path></svg>
      </div>
      <div>
        <h1>VANSHAVALI</h1>
        <p>Our People. Our Story.</p>
      </div>
    </div>

    <div class="spacer"></div>

    <div class="search-wrap">
      <svg class="si" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.2-3.2"></path></svg>

      <div class="results" id="results" role="listbox"></div>
    </div>

    <button class="btn ghost" id="themeBtn" aria-pressed="false" aria-label="Switch appearance" title="Switch appearance">
      <svg class="ic-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"></circle><path d="M12 2.6v2.2M12 19.2v2.2M4.4 12H2.2M21.8 12h-2.2M6.3 6.3 4.8 4.8M19.2 19.2l-1.5-1.5M17.7 6.3l1.5-1.5M4.8 19.2l1.5-1.5"></path></svg>
      <svg class="ic-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M20 14.4A8.4 8.4 0 0 1 9.6 4a8.4 8.4 0 1 0 10.4 10.4Z"></path></svg>
    </button>
    <button class="btn" id="importBtn">

      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 4v12"></path><path d="m7.5 11.5 4.5 4.5 4.5-4.5"></path><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"></path></svg>
      Import
    </button>
    <input type="file" id="importFile" accept=".vansh,.json,.html,application/json,text/html" hidden>
    <button class="btn" id="exportBtn" aria-haspopup="menu">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 16V4"></path><path d="m7.5 8.5 4.5-4.5 4.5 4.5"></path><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"></path></svg>
      Export
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
    <button class="btn primary" id="addBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
      Add Person

    <div class="menu" id="exportMenu" role="menu">
      <button id="saveData" role="menuitem">

  </header>

  <div class="main">

      </div>

      <button class="edge-del" id="edgeDel" hidden title="Remove this relationship" aria-label="Remove this relationship">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16"></path><path d="M9 7V5h6v2"></path><path d="M6 7l1 13h10l1-13"></path></svg>

          Add Person

</div>

      const blocked = a.y !== b.y || [...nodes.values()].some((n) =>

  const xs = [...nodes.values()];

    x2: Math.max(...xs.map((n) => n.x + NODE_W)), y2: Math.max(...xs.map((n) => n.y + NODE_H))

  const gens = [...new Set(allXs.map((n) => n.gen).filter((g) => typeof g === "number"))].sort((a, b) => a - b);
  state.layout = { nodes, edges, bbox, gens, unmappedZone };
}

  const ico = (d) => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">${d}</svg>`;
  const subtypeSelect = (relId, subtype) => `<select class="rel-subtype-select" data-relid="${relId}">
      <option value="biological"${subtype !== "adopted" ? " selected" : ""}>Biological</option>
      <option value="adopted"${subtype === "adopted" ? " selected" : ""}>Adopted</option>
    </select>`;
  const relRow = (label, person, opts) => {
    opts = opts || {};
    if (!person) return `<div class="rel-row" style="cursor:default"><span class="avatar" style="width:32px;height:32px"></span><span><span class="k">${label}</span><span class="v" style="display:block;color:var(--text-faint)">—</span></span></div>`;
    return `<div class="rel-row-wrap">
        <button class="rel-row" data-goto="${person.id}">${avatarHTML(person, 32)}<span><span class="k">${label}</span><span class="v" style="display:block">${esc(fullName(person))}</span></span>
          <svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m9 6 6 6-6 6"/></svg></button>
        ${opts.extra || ""}
        ${opts.relId ? `<button class="icon-btn" data-unlink="${opts.relId}" title="Remove ${esc(label)}" aria-label="Remove ${esc(label)}">✕</button>` : ""}
      </div>`;
  };

  let tabBody = "";
  if (state.tab === "overview") {
    tabBody = `
      <div class="field">${ico('<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/>')}<div><div class="k">Born</div><div class="v">${fmtDate(p.birthDate)}</div></div></div>
      ${p.deceased ? `<div class="field">${ico('<path d="M12 21V8M7 8h10M9 4h6v4H9z"/>')}<div><div class="k">Died</div><div class="v">${fmtDate(p.deathDate)}</div></div></div>` : ""}
      <div class="field">${ico('<path d="M12 21s7-5.2 7-10a7 7 0 1 0-14 0c0 4.8 7 10 7 10Z"/><circle cx="12" cy="11" r="2.4"/>')}<div><div class="k">Place of birth</div><div class="v">${esc(p.birthPlace) || "—"}</div></div></div>
      <div class="field">${ico('<path d="M6 3h4l2 5-2.5 1.5a12 12 0 0 0 5 5L16 12l5 2v4a2 2 0 0 1-2.2 2A17 17 0 0 1 4 5.2 2 2 0 0 1 6 3Z"/>')}<div><div class="k">Telephone</div><div class="v">${esc(phoneText("", p.telephone))}</div></div></div>
      <div class="field">${ico('<rect x="7" y="2.5" width="10" height="19" rx="2.6"/><path d="M11 18.5h2"/>')}<div><div class="k">Mobile</div><div class="v">${esc(phoneText(p.mobCode, p.mobile))}</div></div></div>
      ${(p.mobile2 || "").trim() ? `<div class="field">${ico('<rect x="7" y="2.5" width="10" height="19" rx="2.6"/><path d="M11 18.5h2"/>')}<div><div class="k">Mobile 2</div><div class="v">${esc(phoneText(p.mob2Code, p.mobile2))}</div></div></div>` : ""}
      <div class="field">${ico('<path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/>')}<div><div class="k">Notes</div><div class="v">${esc(p.notes) || "—"}</div></div></div>
      <div class="field">${ico('<circle cx="12" cy="12" r="9"/><path d="M12 8v5"/>')}<div><div class="k">Status</div><div class="v">${p.deceased ? "Deceased" : "Living"}</div></div></div>`;
  } else if (state.tab === "relationships") {
    const kids = childrenOf(p.id).map(byId).filter(Boolean);
    const sibs = siblingsOf(p.id).map(byId).filter(Boolean);
    const sps = spouseRels(p.id);
    const pRows = parentRels(p.id).map((r) => ({ r, per: byId(r.parentId) })).filter((x) => x.per);
    const fatherRows = pRows.filter((x) => x.per.gender !== "f");
    const motherRows = pRows.filter((x) => x.per.gender === "f");
    const parentRows = (rows, label) => rows.length
      ? rows.map((x, i) => relRow(rows.length > 1 ? `${label} ${i + 1} · duplicate` : label, x.per,
          { relId: x.r.id, extra: subtypeSelect(x.r.id, x.r.subtype) })).join("")
      : relRow(label, null);
    tabBody = `
      ${parentRows(fatherRows, "Father")}
      ${parentRows(motherRows, "Mother")}
      ${sps.length ? sps.map((r) => {
        const other = byId(r.personA === p.id ? r.personB : r.personA);
        const extra = `<select class="rel-status-select" data-relid="${r.id}">
          <option value="married"${r.status !== "divorced" ? " selected" : ""}>Married</option>
          <option value="divorced"${r.status === "divorced" ? " selected" : ""}>Divorced</option>
        </select>`;
        return relRow("Spouse", other, { relId: r.id, extra });
      }).join("") : relRow("Spouse", null)}
      <div class="sec-title">Children</div>
      ${kids.length ? kids.map((k) => {
        const rel = state.rels.find((r) => r.type === "parent-child" && r.parentId === p.id && r.childId === k.id);
        return relRow("Child", k, { relId: rel && rel.id, extra: rel ? subtypeSelect(rel.id, rel.subtype) : "" });
      }).join("") : `<div style="font-size:13px;color:var(--text-faint);padding:6px 8px">No children recorded</div>`}
      <div class="sec-title">Siblings</div>
      ${sibs.length ? sibs.map((s) => relRow("Sibling", s)).join("") : `<div style="font-size:13px;color:var(--text-faint);padding:6px 8px">No siblings recorded</div>`}
      <div style="font-size:11px;color:var(--text-faint);padding:2px 8px 0">Siblings follow from shared parents above — edit or remove a parent link to change them.</div>
      <div class="divider"></div>
      <button class="btn sm" id="linkRelBtn">＋ Add relationship</button>`;
  } else {
    const media = p.media || [];
    tabBody = `
      <div class="sec-title" style="margin-top:0">Profile photo</div>
      <div class="photo-pick">
        ${p.profilePhoto ? `<img src="${esc(p.profilePhoto)}" alt="">` : `<div style="width:72px;height:72px;border-radius:14px;border:1px solid var(--border);display:grid;place-items:center;color:var(--ini-muted)">${esc(initials(p))}</div>`}
        <div style="display:flex;gap:8px">
          <button class="btn sm" id="editDp">Edit DP</button>
          ${p.profilePhoto ? `<button class="btn sm danger" id="removeDp">Remove</button>` : ""}
        </div>
      </div>
      <div class="sec-title">Media</div>
      <div class="media-grid">
        ${media.map((m, i) => `<img src="${esc(m)}" alt="Photo ${i + 1}">`).join("")}
        <button class="media-add" id="addMedia"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add</button>
      </div>`;
  }

  $("#inspBody").innerHTML = `
    ${bigPhotoHTML(p)}
    <div class="insp-headrow">
      <div><div class="insp-name">${esc(fullName(p))}</div><div class="insp-dates">${esc(lifeLine(p)).replace("–", p.deceased ? "–" : "– Present")}</div></div>
      <div class="head-actions">
        <button class="btn sm" id="editPerson">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20h4L20 8l-4-4L4 16v4Z"/></svg>Edit</button>
        <button class="btn sm danger" id="deletePerson">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/></svg>Delete</button>
      </div>
    </div>
    <div class="tabs">
      <button data-tab="overview" class="${state.tab === "overview" ? "on" : ""}">Overview</button>
      <button data-tab="relationships" class="${state.tab === "relationships" ? "on" : ""}">Relationships</button>
      <button data-tab="media" class="${state.tab === "media" ? "on" : ""}">Media</button>
    </div>
    ${tabBody}`;

  $("#inspBody").querySelectorAll("[data-tab]").forEach((b) =>
    b.addEventListener("click", () => { state.tab = b.dataset.tab; renderInspector(); }));
  $("#inspBody").querySelectorAll("[data-goto]").forEach((b) =>
    b.addEventListener("click", () => select(b.dataset.goto)));
  const ep = $("#editPerson"); if (ep) ep.addEventListener("click", () => personModal(p));
  const dpBtn = $("#deletePerson");
  if (dpBtn) dpBtn.addEventListener("click", async () => {
    const n = state.rels.filter((r) => r.parentId === p.id || r.childId === p.id || r.personA === p.id || r.personB === p.id).length;
    const yes = await confirmDialog(`Delete ${fullName(p)}?`,
      `This removes <b>${esc(fullName(p))}</b> from the Vanshavali${n ? ` along with ${n} relationship${n > 1 ? "s" : ""}` : ""}. This cannot be undone.`,
      "Delete", true);
    if (!yes) return;
    state.people = state.people.filter((x) => x.id !== p.id);
    state.rels = state.rels.filter((r) => r.parentId !== p.id && r.childId !== p.id && r.personA !== p.id && r.personB !== p.id);
    state.selected = null; closeInspector(); render(); toast("Person removed");
  });
  const lr = $("#linkRelBtn"); if (lr) lr.addEventListener("click", () => relationshipModal(p));
  const dp = $("#editDp"); if (dp) dp.addEventListener("click", () => pickImage((data) => { p.profilePhoto = data; render(); renderInspector(); }));
  const rdp = $("#removeDp"); if (rdp) rdp.addEventListener("click", () => { p.profilePhoto = null; render(); renderInspector(); });
  const am = $("#addMedia"); if (am) am.addEventListener("click", () => pickImage((data) => { p.media = (p.media || []).concat([data]); renderInspector(); }));
  $("#inspBody").querySelectorAll("[data-unlink]").forEach((b) => b.addEventListener("click", (e) => {
    e.stopPropagation();
    state.rels = state.rels.filter((r) => r.id !== b.dataset.unlink);
    render(); renderInspector(); toast("Relationship removed");
  }));
  $("#inspBody").querySelectorAll(".rel-status-select").forEach((s) => s.addEventListener("change", () => {
    const r = state.rels.find((x) => x.id === s.dataset.relid);
    if (r) { r.status = s.value; render(); renderInspector(); toast("Relationship updated"); }
  }));
  $("#inspBody").querySelectorAll(".rel-subtype-select").forEach((s) => s.addEventListener("change", () => {
    const r = state.rels.find((x) => x.id === s.dataset.relid);
    if (r) { r.subtype = s.value; render(); renderInspector(); toast("Relationship updated"); }
  }));
}

/* ========================= IMAGE INPUT ========================= */
function pickImage(cb) {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*";
  inp.addEventListener("change", () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const img = new Image(), fr = new FileReader();
    fr.onload = () => {
      img.onload = () => {
        // downscale to keep the portable HTML small
        const max = 420, s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL("image/jpeg", 0.86));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(f);
  });
  inp.click();
}

/* ========================= MODALS ========================= */
const scrim = $("#scrim"), modal = $("#modal");
function openModal(html) { modal.innerHTML = html; scrim.classList.add("show"); }
function confirmDialog(title, messageHTML, confirmLabel, danger) {
  return new Promise((resolve) => {
    openModal(`
      <header><h3>${esc(title)}</h3></header>
      <div class="body"><div style="font-size:13.5px;line-height:1.6;color:var(--text-dim)">${messageHTML}</div></div>
      <div class="foot">
        <button class="btn" id="cfNo">Cancel</button>
        <button class="btn ${danger ? "danger" : "primary"}" id="cfYes">${esc(confirmLabel || "Confirm")}</button>
      </div>`);
    let done = false;
    const onScrim = (e) => { if (e.target === scrim) fin(false); };
    const onKey = (e) => { if (e.key === "Escape") fin(false); };
    function fin(v) {
      if (done) return;
      done = true;
      scrim.removeEventListener("mousedown", onScrim);
      document.removeEventListener("keydown", onKey);
      closeModal();
      resolve(v);
    }
    scrim.addEventListener("mousedown", onScrim);
    document.addEventListener("keydown", onKey);
    $("#cfNo").addEventListener("click", () => fin(false));
    $("#cfYes").addEventListener("click", () => fin(true));
  });
}
function closeModal() { scrim.classList.remove("show"); }
scrim.addEventListener("mousedown", (e) => { if (e.target === scrim) closeModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeModal(); hideMenu(); hideResults(); } });

const ROLES = [
  ["father", "Father"], ["mother", "Mother"], ["spouse", "Spouse"],
  ["son", "Son"], ["daughter", "Daughter"], ["brother", "Brother"], ["sister", "Sister"]
];

function personModal(existing) {
  const base = existing || Object.assign({ id: null }, PERSON_DEFAULTS);
  let photo = base.profilePhoto || null;
  const pending = []; // {role, personId, attr}
  /* Field values typed into the form so far. Re-captured every time we're
     about to leave the form (e.g. to open the relationship picker) so
     nothing typed gets lost when the form is redrawn on return. */
  let draft = {
    firstName: base.firstName || "", lastName: base.lastName || "", gender: base.gender || "m",
    birthDate: base.birthDate || "", deathDate: base.deathDate || "",
    deceased: !!base.deceased, birthPlace: base.birthPlace || "", notes: base.notes || "",
    telephone: base.telephone || "",
    mobCode: base.mobCode || "+91", mobile: base.mobile || "",
    mob2Code: base.mob2Code || "+91", mobile2: base.mobile2 || ""
  };
  function captureDraft() {
    if (!$("#fFirst")) return;
    draft = {
      firstName: $("#fFirst").value, lastName: $("#fLast").value, gender: $("#fGender").value,
      birthDate: $("#fBirth").value, deathDate: $("#fDeath").value,
      deceased: $("#fDeceased").checked, birthPlace: $("#fPlace").value, notes: $("#fNotes").value,
      telephone: $("#fTel").value,
      mobCode: $("#fMobCode").value, mobile: $("#fMob").value,
      mob2Code: $("#fMob2Code").value, mobile2: $("#fMob2").value
    };
  }

  function showForm() {
    const p = draft;
    openModal(`
      <header>
        <h3>${existing ? "Edit person" : "Add person"}</h3>
        <div class="sub">${existing ? "Changes apply immediately to the tree." : "Add someone and optionally connect them to your family."}</div>
      </header>
      <div class="body">
        <div class="photo-pick" style="margin-bottom:18px">
          <div id="photoBox">${photo ? `<img src="${esc(photo)}" alt="">` : `<div style="width:72px;height:72px;border-radius:14px;border:1px dashed var(--border);display:grid;place-items:center;color:var(--text-faint);font-size:11px">Photo</div>`}</div>
          <div style="display:flex;gap:8px"><button class="btn sm" id="pPhoto">Choose photo</button>${photo ? `<button class="btn sm danger" id="pPhotoRm">Remove</button>` : ""}</div>
        </div>
        <div class="grid2">
          <label class="f"><span>FIRST NAME</span><input type="text" id="fFirst" value="${esc(p.firstName)}" /></label>
          <label class="f"><span>LAST NAME</span><input type="text" id="fLast" value="${esc(p.lastName)}" /></label>
          <label class="f"><span>DATE OF BIRTH</span><input type="date" id="fBirth" value="${esc(p.birthDate || "")}" /></label>
          <label class="f"><span>DATE OF DEATH</span><input type="date" id="fDeath" value="${esc(p.deathDate || "")}" /></label>
          <label class="f"><span>GENDER</span><select id="fGender"><option value="m"${p.gender !== "f" ? " selected" : ""}>Male</option><option value="f"${p.gender === "f" ? " selected" : ""}>Female</option></select></label>
          <label class="f"><span>PLACE OF BIRTH</span><input type="text" id="fPlace" value="${esc(p.birthPlace || "")}" /></label>
          <label class="f"><span>TELEPHONE</span><input type="tel" id="fTel" value="${esc(p.telephone || "")}" placeholder="e.g. +91 20 2612 3456" /></label>
          <label class="f"><span>MOBILE</span><span class="phone-row"><select id="fMobCode">${dialOptions(p.mobCode)}</select><input type="tel" id="fMob" value="${esc(p.mobile || "")}" placeholder="Mobile number" /></span></label>
          <label class="f"><span>MOBILE 2</span><span class="phone-row"><select id="fMob2Code">${dialOptions(p.mob2Code)}</select><input type="tel" id="fMob2" value="${esc(p.mobile2 || "")}" placeholder="Second mobile (optional)" /></span></label>
        </div>
        <div style="margin:14px 0"><label class="check"><input type="checkbox" id="fDeceased" ${p.deceased ? "checked" : ""}/> Deceased</label></div>
        <label class="f"><span>NOTES</span><textarea id="fNotes">${esc(p.notes || "")}</textarea></label>
        ${existing ? "" : `
        <div class="divider"></div>
        <div class="sec-title" style="margin-top:0">Relationships (optional)</div>
        <div class="rel-add">${ROLES.map(([k, l]) => `<button class="chip" data-role="${k}">＋ ${l}</button>`).join("")}</div>
        <div class="rel-list" id="pendingList"></div>`}
      </div>
      <div class="foot">
        ${existing ? `<button class="btn danger" id="pDelete" style="margin-right:auto">Delete person</button>` : ""}
        <button class="btn" id="pCancel">Cancel</button>
        <button class="btn primary" id="pSave">${existing ? "Save changes" : "Add person"}</button>
      </div>`);

    const drawPending = () => {
      const box = $("#pendingList"); if (!box) return;
      box.innerHTML = pending.map((r, i) => {
        const per = byId(r.personId);
        return `<div class="rel-pill"><span class="role">${ROLES.find((x) => x[0] === r.role)[1]}</span>${avatarHTML(per, 26)}<span>${esc(fullName(per))}</span>

            ? `<select data-attr="${i}"><option value="married">Married</option><option value="divorced"${r.attr === "divorced" ? " selected" : ""}>Divorced</option></select>`
            : (r.role === "father" || r.role === "mother" || r.role === "son" || r.role === "daughter")
              ? `<select data-attr="${i}"><option value="biological">Biological</option><option value="adopted"${r.attr === "adopted" ? " selected" : ""}>Adopted</option></select>` : `<span style="margin-left:auto"></span>`}

      box.querySelectorAll("[data-attr]").forEach((s) => s.addEventListener("change", () => { pending[+s.dataset.attr].attr = s.value; }));
    };
    drawPending();

    modal.querySelectorAll("[data-role]").forEach((b) => b.addEventListener("click", () => {
      captureDraft();
      const role = b.dataset.role;
      personPicker(ROLES.find((x) => x[0] === role)[1], null,
        (id) => { pending.push({ role, personId: id, attr: role === "spouse" ? "married" : "biological" }); showForm(); },
        () => showForm());
    }));
    $("#pPhoto").addEventListener("click", () => { captureDraft(); pickImage((d) => { photo = d; showForm(); }); });
    const rm = $("#pPhotoRm"); if (rm) rm.addEventListener("click", () => { captureDraft(); photo = null; showForm(); });
    $("#pCancel").addEventListener("click", closeModal);
    const del = $("#pDelete");
    if (del) del.addEventListener("click", () => {
      state.people = state.people.filter((x) => x.id !== base.id);
      state.rels = state.rels.filter((r) => r.parentId !== base.id && r.childId !== base.id && r.personA !== base.id && r.personB !== base.id);
      state.selected = null; closeModal(); closeInspector(); render(); toast("Person removed");
    });

    $("#pSave").addEventListener("click", () => {
      const first = $("#fFirst").value.trim();
      if (!first) { $("#fFirst").focus(); return; }
      const data = {
        firstName: first, lastName: $("#fLast").value.trim(), gender: $("#fGender").value,
        birthDate: $("#fBirth").value || null, deathDate: $("#fDeath").value || null,
        deceased: $("#fDeceased").checked, birthPlace: $("#fPlace").value.trim(), notes: $("#fNotes").value.trim(),
        telephone: $("#fTel").value.trim(),
        mobCode: $("#fMobCode").value, mobile: $("#fMob").value.trim(),
        mob2Code: $("#fMob2Code").value, mobile2: $("#fMob2").value.trim(),
        profilePhoto: photo
      };
      if (existing) {
        Object.assign(existing, data);
        closeModal(); render(); renderInspector(); toast("Person updated");
      } else {
        const np = normalizePerson(Object.assign({ id: uid("p") }, PERSON_DEFAULTS, data), state.people.length);
        state.people.push(np);
        closeModal(); render();
        (async () => {
          let allOk = true;
          for (const r of pending) {
            const res = await addRelationshipInteractive(np.id, r.role, r.personId, r.attr);
            if (!res.ok) allOk = false;
          }
          render(); select(np.id);
          toast(allOk ? fullName(np) + " added" : fullName(np) + " added — one relationship was skipped");
        })();
      }
    });
    setTimeout(() => $("#fFirst").focus(), 40);
  }

  showForm();
}

/* Returns true if every relationship implied by this call was added, false
   if one or more were skipped because they would have made someone their
   own ancestor. Partial success (e.g. one shared-parent link out of two)
   still applies whatever was safe to add. */
function parentSlot(childId, gender) {
  const want = gender === "f" ? "f" : "m";
  return parentRels(childId).map((r) => ({ rel: r, per: byId(r.parentId) }))
    .find((x) => x.per && (x.per.gender === "f" ? "f" : "m") === want) || null;
}

function addRelationship(personId, role, otherId, attr, opts) {
  opts = opts || {};
  const mk = (o) => Object.assign({ id: uid("r") }, o);
  let ok = true, reason = null, conflict = null;

  /* A person can have at most one father and at most one mother. Attaching a
     parent to a child whose matching slot is already taken either replaces the
     old link (when the caller confirmed it) or is refused as a conflict. */
  const attachParent = (parentId, childId, subtype, allowReplace) => {
    const par = byId(parentId);
    if (!par) return "bad";
    const slot = parentSlot(childId, par.gender);
    if (slot && slot.per.id === parentId) return "exists";
    if (slot) {
      if (!allowReplace) { conflict = { existing: slot.per, child: byId(childId), slotLabel: par.gender === "f" ? "mother" : "father" }; return "conflict"; }
      state.rels = state.rels.filter((r) => r.id !== slot.rel.id);
    }
    if (wouldCreateCycle(parentId, childId)) return "cycle";
    state.rels.push(mk({ type: "parent-child", parentId, childId, subtype: subtype || "biological" }));
    return "ok";
  };
  const fin = (res) => {
    if (res === "ok" || res === "exists") return true;
    ok = false;
    reason = res === "conflict" ? "duplicate-parent" : res === "cycle" ? "cycle" : "failed";
    return false;
  };

  if (role === "father" || role === "mother") {
    fin(attachParent(otherId, personId, attr || "biological", !!opts.replace));
  } else if (role === "son" || role === "daughter" || role === "child") {
    if (fin(attachParent(personId, otherId, attr || "biological", !!opts.replace))) {
      // couples share children — but never overwrite a parent the child already has
      spousesOf(personId).forEach((sp) => {
        const spouse = byId(sp);
        if (!spouse) return;
        if (parentSlot(otherId, spouse.gender)) return;
        attachParent(sp, otherId, attr || "biological", false);
      });
    }
  } else if (role === "spouse") {
    state.rels.push(mk({ type: "spouse", personA: personId, personB: otherId, status: attr || "married" }));
  } else if (role === "brother" || role === "sister" || role === "sibling") {
    const ps = parentsOf(otherId);
    if (ps.length) ps.forEach((pp) => { const par = byId(pp); if (par && !parentSlot(personId, par.gender)) fin(attachParent(pp, personId, "biological", false)); });
    else parentsOf(personId).forEach((pp) => { const par = byId(pp); if (par && !parentSlot(otherId, par.gender)) fin(attachParent(pp, otherId, "biological", false)); });
  }
  return { ok, reason, conflict };
}

/* Adds a relationship, asking the user first if it would give someone a second
   father or mother. Returns true when something was recorded. */
async function addRelationshipInteractive(personId, role, otherId, attr) {
  let res = addRelationship(personId, role, otherId, attr);
  if (!res.ok && res.reason === "duplicate-parent" && res.conflict) {
    const c = res.conflict;
    const incoming = byId(role === "father" || role === "mother" ? otherId : personId);
    const yes = await confirmDialog(`Replace ${c.slotLabel}?`,
      `<b>${esc(fullName(c.child))}</b> already has a ${c.slotLabel} recorded: <b>${esc(fullName(c.existing))}</b>.
       A person can only have one ${c.slotLabel}. Replace with <b>${esc(incoming ? fullName(incoming) : "this person")}</b>?`,
      "Replace");
    if (!yes) return { ok: false, cancelled: true };
    res = addRelationship(personId, role, otherId, attr, { replace: true });
  }
  return res;
}

function personPicker(roleLabel, excludeId, onPick, onBack) {
  const list = (q) => state.people
    .filter((x) => x.id !== excludeId && fullName(x).toLowerCase().includes(q.toLowerCase()))
    .slice(0, 60)
    .map((x) => `<button class="res-item" data-pick="${x.id}">${avatarHTML(x, 30)}<span><span class="nm" style="display:block">${esc(fullName(x))}</span><span class="dt">${esc(lifeLine(x))}</span></span></button>`).join("")
    || `<div class="res-empty">No matching person</div>`;

  openModal(`
    <header><h3>Link ${esc(roleLabel)}</h3><div class="sub">Choose an existing person, or create a new one.</div></header>
    <div class="body">
      <input type="text" id="pickQ" placeholder="Search existing people…" autocomplete="off" />
      <div class="picker-list" id="pickList">${list("")}</div>
    </div>
    <div class="foot">
      <button class="btn" id="pickBack">Back</button>
      <button class="btn primary" id="pickNew">＋ Create new person</button>
    </div>`);

  const bind = () => modal.querySelectorAll("[data-pick]").forEach((b) =>
    b.addEventListener("click", () => onPick(b.dataset.pick)));
  bind();
  $("#pickQ").addEventListener("input", () => { $("#pickList").innerHTML = list($("#pickQ").value); bind(); });
  $("#pickBack").addEventListener("click", () => { if (onBack) onBack(); });
  $("#pickNew").addEventListener("click", () => quickCreate((id) => onPick(id)));
  setTimeout(() => $("#pickQ").focus(), 40);
}

function quickCreate(cb) {
  openModal(`
    <header><h3>Create new person</h3><div class="sub">You can add full details later.</div></header>
    <div class="body">
      <div class="grid2">
        <label class="f"><span>FIRST NAME</span><input type="text" id="qFirst" /></label>
        <label class="f"><span>LAST NAME</span><input type="text" id="qLast" /></label>
        <label class="f"><span>GENDER</span><select id="qGender"><option value="m">Male</option><option value="f">Female</option></select></label>
        <label class="f"><span>DATE OF BIRTH</span><input type="date" id="qBirth" /></label>
      </div>
    </div>
    <div class="foot"><button class="btn" id="qCancel">Cancel</button><button class="btn primary" id="qSave">Create</button></div>`);

  $("#qSave").addEventListener("click", () => {
    const f = $("#qFirst").value.trim(); if (!f) { $("#qFirst").focus(); return; }

    state.people.push(np); closeModal(); cb(np.id);
  });

}

function relationshipModal(person) {
  function show() {
    openModal(`
      <header><h3>Add relationship</h3><div class="sub">Connect ${esc(fullName(person))} to someone in your Vanshavali.</div></header>
      <div class="body">
        <div class="rel-add">${ROLES.map(([k, l]) => `<button class="chip" data-role="${k}">＋ ${l}</button>`).join("")}</div>
        <div style="font-size:12.5px;color:var(--text-faint);margin-top:14px">Pick a role, then choose an existing person or create a new one.</div>
      </div>
      <div class="foot"><button class="btn" id="rClose">Done</button></div>`);
    $("#rClose").addEventListener("click", closeModal);
    modal.querySelectorAll("[data-role]").forEach((b) => b.addEventListener("click", () => {
      const role = b.dataset.role;
      personPicker(ROLES.find((x) => x[0] === role)[1], person.id,
        async (id) => {
          const attr = role === "spouse" ? "married" : "biological";
          closeModal();
          const res = await addRelationshipInteractive(person.id, role, id, attr);
          render(); renderInspector();
          if (res.cancelled) return toast("No changes made");
          toast(res.ok ? "Relationship added"
            : res.reason === "cycle" ? "That link would make someone their own ancestor — not added"
            : "Relationship not added");
        },
        () => show());
    }));
  }
  show();
}

/* ---- guard against accidental refresh / tab close losing everything ---- */
window.addEventListener("beforeunload", (e) => {
  if (!state.people.length) return;
  e.preventDefault();
  e.returnValue = "All Vanshavali data in this window will be lost unless you have saved a data file.";
  return e.returnValue;
});

const searchInput = $("#search"), results = $("#results");
let resIndex = -1;
function runSearch() {
  const q = searchInput.value.trim().toLowerCase();
  if (!q) return hideResults();
  const hits = state.people.filter((p) =>
    (p.firstName || "").toLowerCase().includes(q) || (p.lastName || "").toLowerCase().includes(q)).slice(0, 12);
  results.innerHTML = hits.length
    ? hits.map((p, i) => `<button class="res-item${i === 0 ? " active" : ""}" data-id="${p.id}">${avatarHTML(p, 30)}<span><span class="nm" style="display:block">${esc(fullName(p))}</span><span class="dt">${esc(lifeLine(p))}</span></span></button>`).join("")
    : `<div class="res-empty">No one found</div>`;
  resIndex = hits.length ? 0 : -1;
  results.classList.add("show");
  results.querySelectorAll("[data-id]").forEach((b) => b.addEventListener("click", () => { pickResult(b.dataset.id); }));
}
function pickResult(id) { hideResults(); searchInput.value = ""; select(id); }
function hideResults() { results.classList.remove("show"); }
searchInput.addEventListener("input", runSearch);
searchInput.addEventListener("keydown", (e) => {
  const items = [...results.querySelectorAll("[data-id]")];
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); if (!items.length) return;
    resIndex = (resIndex + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
    items.forEach((it, i) => it.classList.toggle("active", i === resIndex));
  } else if (e.key === "Enter" && items[resIndex]) pickResult(items[resIndex].dataset.id);
});
document.addEventListener("click", (e) => { if (!e.target.closest(".search-wrap")) hideResults(); });

function treeSVGString(pad) {
  const b = state.layout.bbox;
  const W = b.w + pad * 2, H = b.h + pad * 2;
  const nodesSvg = [...state.layout.nodes.values()].map((n) => {
    const p = byId(n.id);
    const tx = n.x - b.x + pad, ty = n.y - b.y + pad;
    return `<g transform="translate(${tx},${ty})">
      <rect x="0" y="0" width="${NODE_W}" height="${NODE_H}" rx="15" fill="${cssVar(p.gender === "f" ? "--node-f" : "--node-m")}" stroke="${cssVar("--node-stroke")}"/>
      <clipPath id="xc-${p.id}"><circle cx="38" cy="37" r="21"/></clipPath>
      <circle cx="38" cy="37" r="21" fill="${cssVar(p.gender === "f" ? "--avatar-f" : "--avatar-m")}" stroke="${cssVar("--avatar-stroke")}"/>
      ${p.profilePhoto
        ? `<image href="${esc(p.profilePhoto)}" x="17" y="16" width="42" height="42" preserveAspectRatio="xMidYMid slice" clip-path="url(#xc-${p.id})"/>`
        : `<text x="38" y="42" text-anchor="middle" font-size="14" font-weight="600" fill="${cssVar("--node-ini")}">${esc(initials(p))}</text>`}
      <text x="70" y="34" font-size="13.5" font-weight="600" fill="${cssVar("--text")}">${esc(fitName(p))}</text>
      <text x="70" y="52" font-size="11.5" fill="${cssVar("--node-sub")}">${esc(lifeLine(p))}</text>
    </g>`;
  }).join("");
  const LINE_COLOR = {
    pc: cssVar("--line-parent"), adopted: cssVar("--line-parent-adopted"),
    spouse: cssVar("--line-spouse"), divorced: cssVar("--line-spouse-divorced"),
    sibling: cssVar("--line-sibling"), "sibling-half": cssVar("--line-sibling-half")
  };
  const edgesSvg = state.layout.edges.map((e) => {
    const stroke = e.cls === "adopted" ? LINE_COLOR.adopted
      : e.cls === "divorced" ? LINE_COLOR.divorced
      : e.kind === "sibling" ? (e.cls === "half" ? LINE_COLOR["sibling-half"] : LINE_COLOR.sibling)
      : e.kind === "spouse" ? LINE_COLOR.spouse : LINE_COLOR.pc;
    const dash = e.cls === "adopted" ? 'stroke-dasharray="1 5" stroke-linecap="round"'
      : e.cls === "divorced" ? 'stroke-dasharray="5 4"'
      : e.kind === "sibling" ? 'stroke-dasharray="4 4" stroke-linecap="round"' : "";
    const w = e.kind === "sibling" ? 1.4 : 1.6;
    return `<path d="${e.d}" fill="none" stroke="${stroke}" stroke-width="${w}" ${dash}/>`;
  }).join("");
  const z = state.layout.unmappedZone;
  const zoneSvg = z ? `<rect x="${z.x - b.x + pad}" y="${z.y - b.y + pad}" width="${z.w}" height="${z.h}" rx="18"
      fill="${cssVar("--zone-fill")}" stroke="${cssVar("--zone-unmapped")}" stroke-width="1.4" stroke-dasharray="6 6"/>
    <text x="${z.x - b.x + pad + 22}" y="${z.y - b.y + pad + 26}" font-size="12.5" font-weight="600"
      letter-spacing="1" fill="${cssVar("--text-faint")}">UNMAPPED</text>` : "";
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <rect width="${W}" height="${H}" fill="${cssVar("--canvas-b")}"/>
    <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" transform="translate(${-b.x + b.x},0)">
      ${zoneSvg}
      <g transform="translate(${pad - b.x},${pad - b.y})">${edgesSvg}</g>
      ${nodesSvg}
    </g></svg>`;
}

$("#saveImg").addEventListener("click", async () => {
  hideMenu();
  if (!state.layout.bbox) return toast("Nothing to export yet");
  toast("Rendering high-resolution image…");
  const pad = 80;
  const b = state.layout.bbox;
  const svgStr = treeSVGString(pad);
  const scale = Math.min(4, Math.max(2, 6000 / (b.w + pad * 2)));
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas");
    c.width = Math.round((b.w + pad * 2) * scale);
    c.height = Math.round((b.h + pad * 2) * scale);
    const ctx = c.getContext("2d");
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0);
    c.toBlob((blob) => {
      download(blob, (state.meta.title || "Vanshavali").replace(/\s+/g, "-") + "-tree.png");
      toast("Image saved · " + c.width + "×" + c.height);
    }, "image/png");
  };
  img.onerror = () => toast("Could not render the image");
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgStr);
});

function currentDoc() {
  const doc = Object.assign({}, state.doc);       /* keeps unknown top-level keys */
  doc.app = "vanshavali";
  doc.formatVersion = FORMAT_VERSION;
  doc.people = state.people;
  doc.relationships = state.rels;
  doc.metadata = Object.assign({}, state.meta, { savedAt: new Date().toISOString() });
  return doc;
}
function currentDataJSON() { return JSON.stringify(currentDoc(), null, 2); }

/* --------------------- SAVE DATA FILE (.vansh) --------------------- */
$("#saveData").addEventListener("click", async () => {
  hideMenu();
  const json = currentDataJSON();
  const name = (state.meta.title || "Vanshavali").replace(/\s+/g, "-") + ".vansh";
  const blob = new Blob([json], { type: "application/json;charset=utf-8" });
  try {
    if (window.showSaveFilePicker) {
      const h = await window.showSaveFilePicker({ suggestedName: name,
        types: [{ description: "Vanshavali data file", accept: { "application/json": [".vansh", ".json"] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close();
    } else {
      download(blob, name);
    }
    toast("Saved · " + state.people.length + " people, " + state.rels.length + " relationships");
  } catch (err) {
    if (err && err.name === "AbortError") return;
    download(blob, name);
    toast("Saved data file");
  }
});

/* ========================= IMPORT ========================= */
/* Accepts a .vansh / .json data file, or a Vanshavali HTML file (the data
   block is pulled straight out of it). Everything goes through normalizeDoc
   so older files gain blank defaults and newer unknown fields survive. */
function parseIncoming(text) {
  const t = text.trim();
  let json = t;
  if (t.slice(0, 200).toLowerCase().indexOf("<!doctype") === 0 || t.slice(0, 1) === "<") {
    const m = t.match(/<script[^>]*id=["']vanshavali-data["'][^>]*>([\s\S]*?)<\/script>/i);
    if (!m) throw new Error("No Vanshavali data found in that HTML file");
    json = m[1];
  }
  return normalizeDoc(JSON.parse(json));
}
function applyDoc(doc) {
  const dropped = repairDoc(doc);
  state.doc = doc;
  state.people = doc.people;
  state.rels = doc.relationships;
  state.meta = doc.metadata;
  state.selected = null;
  closeInspector();
  render();
  fitToView(true);
  toast("Imported · " + doc.people.length + " people, " + doc.relationships.length +
    " relationships" + (dropped ? " · " + dropped + " broken link" + (dropped > 1 ? "s" : "") + " repaired" : ""));
}
function importText(text) {
  let doc;
  try { doc = parseIncoming(text); }
  catch (err) { return toast(err.message || "That file could not be read"); }
  const n = doc.people.length, r = doc.relationships.length;
  openModal(`
    <header><h3>Import lineage</h3><div class="sub">This replaces everything currently on screen.</div></header>
    <div class="body">
      <p style="margin:0 0 10px;color:var(--text-dim)">
        This file holds <strong style="color:var(--text)">${n}</strong> ${n === 1 ? "person" : "people"} and
        <strong style="color:var(--text)">${r}</strong> ${r === 1 ? "relationship" : "relationships"}.
      </p>
      <p style="margin:0;color:var(--text-faint);font-size:12.5px">Anything unsaved here will be lost. Save a data file first if you need a copy.</p>
    </div>
    <div class="foot">
      <button class="btn" id="imCancel">Cancel</button>
      <button class="btn primary" id="imOk">Import &amp; trace</button>
    </div>`);
  $("#imCancel").addEventListener("click", closeModal);
  $("#imOk").addEventListener("click", () => { closeModal(); applyDoc(doc); });
}
function importFileObj(file) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => importText(String(fr.result || ""));
  fr.onerror = () => toast("Could not read that file");
  fr.readAsText(file);
}
$("#importBtn").addEventListener("click", () => $("#importFile").click());
$("#importFile").addEventListener("change", (e) => {
  importFileObj(e.target.files && e.target.files[0]);
  e.target.value = "";
});
/* Drag a data file anywhere onto the window to import it. */
["dragenter", "dragover"].forEach((ev) => document.addEventListener(ev, (e) => {
  if (!e.dataTransfer || ![...e.dataTransfer.types].includes("Files")) return;
  e.preventDefault(); e.dataTransfer.dropEffect = "copy";
  document.body.classList.add("dropping");
}));
["dragleave", "dragend"].forEach((ev) => document.addEventListener(ev, (e) => {
  if (e.relatedTarget) return;
  document.body.classList.remove("dropping");
}));
document.addEventListener("drop", (e) => {
  if (!e.dataTransfer || !e.dataTransfer.files.length) return;
  e.preventDefault();
  document.body.classList.remove("dropping");
  importFileObj(e.dataTransfer.files[0]);
});
function buildPortableHTML() {
  const json = currentDataJSON();
  const open = '<script id="vanshavali-data" type="application/json">';
  const i = PRISTINE_HTML.indexOf(open);
  const j = PRISTINE_HTML.indexOf("<\/script>", i);
  if (i < 0 || j < 0) throw new Error("data block not found");
  return PRISTINE_HTML.slice(0, i + open.length) + "\n" + json + "\n" + PRISTINE_HTML.slice(j);
}
$("#saveHtml").addEventListener("click", () => {
  hideMenu();
  try {
    const html = buildPortableHTML();
    const name = (state.meta.title || "My-Family-Vanshavali").replace(/\s+/g, "-") + ".html";
    const blob = new Blob([html], { type: "text/html;charset=utf-8" });
    if (window.showSaveFilePicker) {
      window.showSaveFilePicker({ suggestedName: name, types: [{ description: "HTML", accept: { "text/html": [".html"] } }] })
        .then(async (h) => { const w = await h.createWritable(); await w.write(blob); await w.close(); toast("Vanshavali saved"); })
        .catch(() => download(blob, name));
    } else download(blob, name);
    toast("Vanshavali HTML downloaded");
  } catch (err) { console.error(err); toast("Could not build the file"); }
});
function download(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2400);
}
